name: mycloud
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mycloud
      POSTGRES_USER: mycloud
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mycloud -d mycloud']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  backend:
    build: ./backend
    env_file: .env.deploy
    environment:
      DB_NAME: mycloud
      DB_USER: mycloud
      DB_HOST: database
      DB_PORT: '5432'
      DEBUG: 'False'
    volumes:
      - media:/app/storage/media
      - static:/app/storage/static
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
  gateway:
    image: nginx:alpine
    ports:
      - '127.0.0.1:${MYCLOUD_PORT:-18081}:8080'
    volumes:
      - ./deploy/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
volumes:
  database:
  media:
  static:
