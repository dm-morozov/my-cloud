limit_req_zone $binary_remote_addr zone=mycloud_auth:10m rate=5r/m;
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloud.mu56.ru;
    ssl_certificate /etc/letsencrypt/live/cloud.mu56.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.mu56.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;
    location ~ ^/api/users/(login|register)/$ {
        limit_req zone=mycloud_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:18081;
    }
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:18081;
        proxy_read_timeout 120s;
    }
}
